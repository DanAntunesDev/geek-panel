; Firmware do GeekMagic SmallTV-Ultra (ESP8266, 4 MB, display ST7789 240x240).
; env "firmware": o painel completo. env "loader": instalador mínimo, cabe no espaço
; pequeno de atualização do firmware de fábrica; ele recebe o "firmware" pela rede.

[platformio]
default_envs = firmware

[base]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 160000000L
; mesma divisão de memória do firmware de fábrica (3 MB de arquivos)
board_build.ldscript = eagle.flash.4m3m.ld
monitor_speed = 115200
build_flags =
  -Os
  -DFW_VERSION=\"0.1.0\"

[env:firmware]
extends = base
lib_deps = bodmer/TFT_eSPI@^2.5.43
build_flags =
  ${base.build_flags}
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DCGRAM_OFFSET
  -DTFT_MISO=-1
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=-1
  -DTFT_DC=0
  -DTFT_RST=2
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1

[env:loader]
extends = base
; só Wi-Fi, página de configuração e atualização: o mínimo para caber no espaço pequeno
build_src_filter =
  +<*>
  -<display.cpp>
  -<stream.cpp>
build_flags =
  ${base.build_flags}
  -DLOADER_ONLY
